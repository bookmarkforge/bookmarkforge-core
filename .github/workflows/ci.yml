name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, lint, tests and security gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
      NODE_ENV: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20.19.0'
          cache: npm
      - run: npm ci
      - run: npm run typecheck:prod
      - run: npm run lint
      - run: npm run test:fast
      - run: npm run check:secrets-in-commit
      - name: Validate workflow, artifact, HTTP, Compose and repository safety
        run: npm run check:workflows && npm run check:workflow-artifacts && npm run check:http-config && npm run check:compose-config && npm run check:runtime-config && npm run check:docker-context && npm run check:repository-hygiene
      - name: Validate CODEOWNERS syntax and placeholders
        run: npm run check:codeowners
      - name: Verify CODEOWNERS owners in GitHub
        if: ${{ vars.CODEOWNERS_ORG != '' }}
        env:
          VERIFY_GITHUB_OWNERS: 'true'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CODEOWNERS_ORG: ${{ vars.CODEOWNERS_ORG }}
        run: npm run check:codeowners
      - run: npm run check:blindeo

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 30
    env:
      CI: true
      NODE_ENV: test
      VITE_TEST_BUILD: 'true'
      VITE_FORCE_DEXIE_STORAGE: 'true'
      VITE_P2P_SIGNALING_URL: ws://127.0.0.1:8787
      SIGNALING_ADMIN_TOKEN: e2e-admin-token
      SIGNALING_PORT: '8787'
      CRISIS_COMPANION_PORT: '8799'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20.19.0'
          cache: npm
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run Playwright E2E
        run: npm run e2e -- --config=playwright.config.ts --grep-invert "@nightly|@multiuser|@visual"
      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playwright-artifacts
          if-no-files-found: ignore
          retention-days: 14
          path: |
            test-results/
            playwright-report/

  visual-baseline-drift:
    name: Visual baseline drift gate
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 10
    env:
      CI: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20.19.0'
          cache: npm
      - run: npm ci
      - name: Flag visual baselines regenerated with >10% pixel drift
        run: node scripts/check-baseline-drift.mjs --base "${BASE_REF}" --max-ratio 0.10
        env:
          # Compare the PR head against the merge base so a regenerated
          # baseline's content shift is reviewed, not silently updated.
          BASE_REF: ${{ github.base_ref && format('origin/{0}', github.base_ref) || format('HEAD~1') }}
      - name: Fail on toHaveScreenshot references to untracked baselines
        # A spec comparing against a baseline the repo has never committed is
        # the silent-gap failure class that twice broke the nightly text-fit
        # suite on fresh checkouts (a first run auto-writes the "expected"
        # image and passes with an unreviewed baseline). The gate statically
        # derives every name a spec's toHaveScreenshot will compare against
        # and fails when one is not tracked in git.
        run: node scripts/check-baseline-gaps.mjs

  build:
    name: Production build and repository checks
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 30
    env:
      CI: true
      NODE_ENV: production
      VITE_APP_VERSION: ci
      VITE_DB_NAME: bookmarkforge_ci
      VITE_P2P_SIGNALING_URL: wss://signal.bookmarkforge.com
      VITE_WHOP_CHECKOUT_URL: https://example.invalid/ci-checkout
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20.19.0'
          cache: npm
      - run: npm ci
      - run: npm run build:ci
      - run: npm run check
      - run: npm audit --omit=dev --audit-level=high
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: build-diagnostics
          if-no-files-found: ignore
          retention-days: 14
          path: |
            bundle-report.md
            ci-chunk-report.json
            dist/manifest.webmanifest
            dist/sw.js

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48
