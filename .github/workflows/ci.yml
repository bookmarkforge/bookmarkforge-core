name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, lint, tests and security gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
      - run: npm ci
      - run: npm run typecheck:prod
      - run: npm run lint
      - run: npm run test:fast
      - run: npm run check:secrets-in-commit
      - run: npm run check:blindeo

  build:
    name: Production build and repository checks
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 30
    env:
      CI: true
      NODE_ENV: production
      VITE_APP_VERSION: ci
      VITE_DB_NAME: bookmarkforge_ci
      VITE_P2P_SIGNALING_URL: wss://signal.bookmarkforge.com
      VITE_WHOP_CHECKOUT_URL: https://example.invalid/ci-checkout
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
      - run: npm ci
      - run: npm run build:ci
      - run: npm run check
      - run: npm audit --omit=dev --audit-level=high
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          if-no-files-found: ignore
          path: |
            bundle-report.md
            ci-chunk-report.json
            dist/manifest.webmanifest
            dist/sw.js

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
