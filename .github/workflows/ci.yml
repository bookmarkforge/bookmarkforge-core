name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, lint, tests and security gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
      - run: npm ci
      - run: npm run typecheck:prod
      - run: npm run lint
      - run: npm run test:fast
      - run: npm run check:secrets-in-commit
      - run: npm run check:blindeo

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 30
    env:
      CI: true
      NODE_ENV: test
      VITE_TEST_BUILD: 'true'
      VITE_FORCE_DEXIE_STORAGE: 'true'
      VITE_P2P_SIGNALING_URL: ws://127.0.0.1:8787
      SIGNALING_ADMIN_TOKEN: e2e-admin-token
      SIGNALING_PORT: '8787'
      CRISIS_COMPANION_PORT: '8799'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run Playwright E2E
        run: npm run e2e -- --config=playwright.config.ts --grep-invert "@nightly|@multiuser|@visual"
      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          if-no-files-found: ignore
          retention-days: 14
          path: |
            test-results/
            playwright-report/

  build:
    name: Production build and repository checks
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 30
    env:
      CI: true
      NODE_ENV: production
      VITE_APP_VERSION: ci
      VITE_DB_NAME: bookmarkforge_ci
      VITE_P2P_SIGNALING_URL: wss://signal.bookmarkforge.com
      VITE_WHOP_CHECKOUT_URL: https://example.invalid/ci-checkout
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
      - run: npm ci
      - run: npm run build:ci
      - run: npm run check
      - run: npm audit --omit=dev --audit-level=high
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          if-no-files-found: ignore
          path: |
            bundle-report.md
            ci-chunk-report.json
            dist/manifest.webmanifest
            dist/sw.js

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
