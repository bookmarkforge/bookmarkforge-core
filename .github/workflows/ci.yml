name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, lint, tests and security gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
      NODE_ENV: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20.19.0'
          cache: npm
      - run: npm ci
      - run: npm run typecheck:prod
      - run: npm run lint
      - run: npm run test:fast
      # Security gate — MANDATORY. Blocks PR merge on any failure.
      # check:security-internal runs the full internal security pipeline:
      # secrets scan, workflow validation, HTTP/Compose/runtime config,
      # Docker context, image pins, repository hygiene, and ZAP baseline.
      # check:server-log-ip-privacy and check:blindeo are separate
      # security checks not covered by check:security-internal.
      - name: Enforce mandatory security gates
        run: |
          npm run check:security-internal
          npm run check:server-log-ip-privacy
          npm run check:blindeo
      # Its own named step so a brand drift (icon or share card deviating
      # from the canonical logo-512.png artwork) surfaces as a separate red
      # check in the Actions UI instead of being buried in `npm run check`.
      - name: Enforce brand logo consistency
        run: npm run check:brand-logo
      # Its own named step so SEO contract drift (canonical/hreflang/OG/Twitter
      # regressions or a noindex leak across landings, legal and aux pages)
      # surfaces as a separate red check instead of being buried in
      # `npm run check`.
      - name: Enforce SEO visibility contract
        run: npm run check:seo
      - name: Validate workflow, artifact, HTTP, Compose and repository safety
        run: npm run check:workflows && npm run check:workflow-artifacts && npm run check:http-config && npm run check:compose-config && npm run check:runtime-config && npm run check:docker-context && npm run check:repository-hygiene
      # Its own named step so a fabricated E2E selector (one that exists only
      # in a unit-test mock, like the lazy BlockNoteView stub's
      # "blocknote-view") surfaces as a separate red check: such a selector
      # can never fail on production drift, which is exactly the failure
      # class the unit-side mock audit exposed.
      - name: Enforce E2E selector reality
        run: npm run check:e2e-selectors
      # Its own named step so factual claim drift (a UI string or locale
      # promising a different password minimum, recovery word count, device
      # limit, KDF MiB parameter, backup interval or price than the code
      # enforces) surfaces as a separate red check. This step ships to the
      # public export unchanged: the open-source tree gets the same gate on
      # its own CI (the exporter also runs it inside the exported tree before
      # it can be pushed).
      - name: Enforce factual claim consistency
        run: npm run check:claim-drift

  slow-tests:
    name: Full unit suite (slow profile, timing enforced)
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 30
    env:
      CI: true
      NODE_ENV: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20.19.0'
          cache: npm
      - run: npm ci
      # The slow profile runs every test file outside test:fast's curated
      # set (~480 files). CI=true turns the timing guard on: a NEW file
      # at/over 10 s, or a pinned file past 2x its budget, fails this job
      # naming the culprit (scripts/check-test-timing.mjs).
      - run: npm run test:slow

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 30
    env:
      CI: true
      NODE_ENV: test
      VITE_TEST_BUILD: 'true'
      VITE_FORCE_DEXIE_STORAGE: 'true'
      VITE_P2P_SIGNALING_URL: ws://127.0.0.1:8787
      SIGNALING_ADMIN_TOKEN: e2e-admin-token
      SIGNALING_PORT: '8787'
      CRISIS_COMPANION_PORT: '8799'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20.19.0'
          cache: npm
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run Playwright E2E
        run: npm run e2e -- --config=playwright.config.ts --grep-invert "@nightly|@multiuser|@visual|@performance"
      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playwright-artifacts
          if-no-files-found: ignore
          retention-days: 14
          path: |
            test-results/
            playwright-report/

  e2e-public-relay:
    # A-3: the one deployment shape the main E2E config cannot exercise — the app
    # built WITHOUT VITE_P2P_SIGNALING_URL, i.e. public-relay mode, where the
    # room secret must never reach the relay the app falls back to. Booting it
    # needs its own Vite dev server (Vite bakes the variable at start-up), which
    # playwright.public-relay.config.ts provides; the spec then stands in for the
    # public relay and asserts the `join` frame carries the keyed room and no
    # secret. Kept a separate job so its budget cannot eat the main E2E suite's.
    name: Playwright E2E (public relay)
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 20
    env:
      CI: true
      NODE_ENV: test
      VITE_TEST_BUILD: 'true'
      VITE_FORCE_DEXIE_STORAGE: 'true'
      # Deliberately empty: this job's whole premise is an app with no
      # configured signaling server. (The Playwright config forces it empty too,
      # because Playwright merges `process.env` into the webServer environment.)
      VITE_P2P_SIGNALING_URL: ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20.19.0'
          cache: npm
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run public-relay E2E
        run: npm run e2e:relay
      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playwright-public-relay-artifacts
          if-no-files-found: ignore
          retention-days: 14
          path: |
            test-results/
            playwright-report/

  visual-baseline-drift:
    name: Visual baseline drift gate
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 10
    env:
      CI: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20.19.0'
          cache: npm
      - run: npm ci
      - name: Flag visual baselines regenerated with >10% pixel drift
        run: node scripts/check-baseline-drift.mjs --base "${BASE_REF}" --max-ratio 0.10
        env:
          # Compare the PR head against the merge base so a regenerated
          # baseline's content shift is reviewed, not silently updated.
          BASE_REF: ${{ github.base_ref && format('origin/{0}', github.base_ref) || format('HEAD~1') }}
      - name: Fail on toHaveScreenshot references to untracked baselines
        # A spec comparing against a baseline the repo has never committed is
        # the silent-gap failure class that twice broke the nightly text-fit
        # suite on fresh checkouts (a first run auto-writes the "expected"
        # image and passes with an unreviewed baseline). The gate statically
        # derives every name a spec's toHaveScreenshot will compare against
        # and fails when one is not tracked in git.
        run: node scripts/check-baseline-gaps.mjs

  build:
    name: Production build and repository checks
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 30
    env:
      CI: true
      NODE_ENV: production
      VITE_APP_VERSION: ci
      VITE_DB_NAME: bookmarkforge_ci
      VITE_P2P_SIGNALING_URL: wss://signal.bookmarkforge.com
      VITE_WHOP_CHECKOUT_URL: https://example.invalid/ci-checkout
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20.19.0'
          cache: npm
      - run: npm ci
      - run: npm run build:ci
      - name: Install Chromium for performance budget
        run: npx playwright install --with-deps chromium
      - name: Measure first interaction performance budget
        run: npm run test:performance
      - name: Enforce complete performance budget
        run: npm run check:performance
      - run: npm run check
      - run: npm audit --omit=dev --audit-level=high
      # `overrides` is the only hand-picked version surface. npm audit alone
      # cannot tell an unfixable upstream advisory from a pin that quietly
      # reintroduced a fixable one, so this gate ties the audit result back to
      # the pins and also fails when a pin no longer applies in the lockfile.
      - name: Override pins must not resolve known CVEs
        run: npm run check:override-cve
      # The declared tree, not only the hand-picked versions: each advisory is
      # classified as ours (a package package.json declares) or inherited (with
      # the direct dependency it arrives through and the minimal bump). The
      # production profile runs inside `npm run check`; this step adds the dev
      # tree, where a vulnerability in the toolchain is still ours to answer.
      - name: Declared dependencies must not carry known CVEs
        run: npm run check:direct-cve:dev
      # Entitlement is only enforceable if every paid route actually requires
      # it. The route table declares each route's access; this gate compares
      # that declaration against the router that runs and fails when a route
      # under a paid namespace is not entitlement-gated.
      - name: Paid routes must require a verified entitlement
        run: npm run check:pro-routes
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: build-diagnostics
          if-no-files-found: ignore
          retention-days: 14
          path: |
            bundle-report.md
            ci-chunk-report.json
            performance-budget-report.json
            dist/manifest.webmanifest
            dist/sw.js

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48
