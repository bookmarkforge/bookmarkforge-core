name: Nightly DAST staging

on:
  schedule:
    - cron: '43 3 * * *'
  workflow_dispatch:
    inputs:
      staging_url:
        description: 'HTTPS URL del staging autorizado (no producción)'
        required: true
        type: string


permissions:
  contents: read

concurrency:
  group: dast-staging
  cancel-in-progress: false

env:
  CI: true
  # Prefer repository variable; manual dispatch can provide an explicit URL.
  STAGING_URL: ${{ inputs.staging_url || vars.STAGING_URL }}

jobs:
  dast:
    name: OWASP ZAP baseline against staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate staging target
        shell: bash
        run: |
          set -euo pipefail
          url="${STAGING_URL:-}"
          if [[ -z "$url" ]]; then
            echo "STAGING_URL is required" >&2
            exit 1
          fi
          if [[ "$url" != https://* ]]; then
            echo "DAST target must use HTTPS" >&2
            exit 1
          fi
          host="${url#https://}"
          host="${host%%/*}"
          # Explicit production deny-list. Keep this conservative: a typo
          # must fail closed rather than scan production.
          case "$host" in
            bookmarkforge.com|www.bookmarkforge.com|api.bookmarkforge.com|signal.bookmarkforge.com)
              echo "Refusing to run DAST against production host: $host" >&2
              exit 1
              ;;
          esac
          if [[ "$host" != *staging* && "$host" != *-stage* && "$host" != *.test.* ]]; then
            echo "Target host must identify staging (*.staging.*, *staging*, *-stage*, or *.test.*)" >&2
            exit 1
          fi
          echo "DAST target accepted: $url"

      - name: Prepare optional authenticated context
        id: auth
        shell: bash
        env:
          DAST_AUTH_HEADER: ${{ secrets.STAGING_DAST_AUTH_HEADER }}
          DAST_CONTEXT_B64: ${{ secrets.STAGING_DAST_CONTEXT_B64 }}
        run: |
          set -euo pipefail
          if [[ -n "${DAST_AUTH_HEADER:-}" ]]; then
            printf '%s' "$DAST_AUTH_HEADER" > .dast-auth-header
            chmod 600 .dast-auth-header
            echo "auth_header=true" >> "$GITHUB_OUTPUT"
          else
            echo "auth_header=false" >> "$GITHUB_OUTPUT"
          fi
          if [[ -n "${DAST_CONTEXT_B64:-}" ]]; then
            printf '%s' "$DAST_CONTEXT_B64" | base64 --decode > .dast-context.context
            chmod 600 .dast-context.context
            echo "context=true" >> "$GITHUB_OUTPUT"
          else
            echo "context=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run OWASP ZAP baseline (public routes)
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: ${{ env.STAGING_URL }}
          allow_issue_writing: false
          fail_action: true
          artifact_name: zap-baseline-staging-public
          cmd_options: '-a -j'

      - name: Run OWASP ZAP authenticated scan
        if: steps.auth.outputs.auth_header == 'true' || steps.auth.outputs.context == 'true'
        shell: bash
        env:
          DAST_AUTH_HEADER: ${{ secrets.STAGING_DAST_AUTH_HEADER }}
          DAST_CONTEXT_B64: ${{ secrets.STAGING_DAST_CONTEXT_B64 }}
        run: |
          set -euo pipefail
          args=("-t" "$STAGING_URL" "-J" "report_authenticated.json" "-w" "report_authenticated.md" "-r" "report_authenticated.html" "-a" "-j")
          if [[ -n "${DAST_CONTEXT_B64:-}" ]]; then
            printf '%s' "$DAST_CONTEXT_B64" | base64 --decode > .dast-context.context
            args+=("-n" "/zap/wrk/.dast-context.context")
          fi
          # The header value is passed through a temporary file and converted
          # to a ZAP replacer config; it never appears in logs or CLI args.
          if [[ -n "${DAST_AUTH_HEADER:-}" ]]; then
            printf '%s' "$DAST_AUTH_HEADER" > .dast-auth-header
            chmod 600 .dast-auth-header
            header_value="$(cat .dast-auth-header)"
            args+=("-z" "-config replacer.full_list(0).description=staging-auth -config replacer.full_list(0).enabled=true -config replacer.full_list(0).matchtype=REQ_HEADER -config replacer.full_list(0).matchstr=Authorization -config replacer.full_list(0).replacement=${header_value}")
          fi
          docker run --rm \
            -v "$PWD:/zap/wrk/:rw" \
            -w /zap/wrk \
            ghcr.io/zaproxy/zaproxy:stable zap-baseline.py "${args[@]}"

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dast-staging-report
          if-no-files-found: ignore
          retention-days: 14
          path: |
            report_html.html
            report_md.md
            report_json.json
            report_authenticated.html
            report_authenticated.md
            report_authenticated.json
            zap-baseline-staging-public/
            zap-baseline-staging-authenticated/
            .dast-*.context
