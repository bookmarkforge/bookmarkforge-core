name: Nightly DAST staging

on:
  schedule:
    - cron: '43 3 * * *'
  workflow_dispatch:
    inputs:
      staging_url:
        description: 'HTTPS URL del staging autorizado (no producción)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: dast-staging
  cancel-in-progress: false

env:
  CI: true
  STAGING_URL: ${{ inputs.staging_url || vars.STAGING_URL }}

jobs:
  dast:
    name: OWASP ZAP baseline against staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Validate staging target
        shell: bash
        run: |
          set -euo pipefail
          url="${STAGING_URL:-}"
          if [[ -z "$url" ]]; then
            echo "STAGING_URL is required" >&2
            exit 1
          fi
          if [[ "$url" != https://* ]]; then
            echo "DAST target must use HTTPS" >&2
            exit 1
          fi
          host="${url#https://}"
          host="${host%%/*}"
          if [[ "$host" == *:* ]]; then
            echo "DAST target must not include a port" >&2
            exit 1
          fi
          case "$host" in
            bookmarkforge.com|www.bookmarkforge.com|api.bookmarkforge.com|signal.bookmarkforge.com)
              echo "Refusing to run DAST against production host: $host" >&2
              exit 1
              ;;
          esac
          if [[ "$host" != *staging* && "$host" != *-stage* && "$host" != *.test.* ]]; then
            echo "Target host must identify staging" >&2
            exit 1
          fi
          echo "DAST target accepted: $url"

      # Authenticated scanning is intentionally disabled until the staging
      # environment supplies a verified context and image digest.
      # The credential references remain here only as a documented contract;
      # this step cannot run while the guard below is false.
      - name: Prepare and validate authenticated ZAP context
        id: auth
        if: ${{ false }}
        shell: bash
        env:
          DAST_CONTEXT_B64: ${{ secrets.STAGING_DAST_CONTEXT_B64 }}
          DAST_CONTEXT_PASSWORD: ${{ secrets.STAGING_DAST_CONTEXT_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          test -n "${DAST_CONTEXT_B64:-}"
          printf '%s' "$DAST_CONTEXT_B64" | base64 --decode > .dast-auth.context
          test -s .dast-auth.context
          if [[ -n "${DAST_CONTEXT_PASSWORD:-}" ]]; then
            printf '%s' "$DAST_CONTEXT_PASSWORD" > .dast-context-password
            chmod 600 .dast-context-password
          fi
          # ZAP validates the context structure and authentication configuration
          # before scanning. The context and password remain workspace files and
          # are never interpolated into Docker arguments or logs.
          ZAP_STAGING_HOST="${STAGING_URL#https://}" npm run check:zap-context
          docker run --rm \
            -v "$PWD:/zap/wrk/:rw" \
            -w /zap/wrk \
            # Digest verificado del tag stable (781a2bdaea47… residio el 2026-08-30).
            ghcr.io/zaproxy/zaproxy@sha256:781a2bdaea47324e7bab583e2263f21d257b0aee61ed51521a5be45f5f5081ef zap-cli context import /zap/wrk/.dast-auth.context
          echo "context=true" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20.19.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate ZAP policy
        run: npm run check:zap-baseline

      - name: Export configurable severity threshold
        id: severity
        shell: bash
        run: |
          set -euo pipefail
          fail_levels="$(sed -n 's/^FAIL_LEVELS=//p' .zap/baseline.conf)"
          [[ "$fail_levels" == *High* && "$fail_levels" == *Critical* ]] || {
            echo "FAIL_LEVELS must include High and Critical" >&2
            exit 1
          }
          echo "fail_levels=$fail_levels" >> "$GITHUB_OUTPUT"
          echo "Configured blocking severities: $fail_levels"

      - name: Run OWASP ZAP baseline (public routes)
        # Pinned by full SHA of tag v0.15.0 (supply-chain hardening; the
        # validate-workflows gate rejects tags for ZAP actions).
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25
        with:
          target: ${{ env.STAGING_URL }}
          allow_issue_writing: false
          fail_action: false
          artifact_name: zap-baseline-staging-public
          cmd_options: '-a -j -c /zap/wrk/.zap/baseline.conf'

      - name: Run OWASP ZAP authenticated scan from validated context
        if: ${{ false }}
        shell: bash
        env:
          DAST_CONTEXT_PASSWORD: ${{ secrets.STAGING_DAST_CONTEXT_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          test -n "${DAST_CONTEXT_PASSWORD:-}"
          unset DAST_CONTEXT_PASSWORD
          # The context is mounted into ZAP. No auth header, token, or password
          # is passed in Docker CLI arguments. Authentication data must be
          # represented by context variables resolved inside the container.
          docker run --rm \
            -v "$PWD:/zap/wrk/:rw" \
            -w /zap/wrk \
            # Digest verificado del tag stable (mismo que el contexto arriba).
            ghcr.io/zaproxy/zaproxy@sha256:781a2bdaea47324e7bab583e2263f21d257b0aee61ed51521a5be45f5f5081ef zap-baseline.py \
              -t "$STAGING_URL" \
              -n /zap/wrk/.dast-auth.context \
              -J report_authenticated.json \
              -w report_authenticated.md \
              -r report_authenticated.html \
              -a -j -c /zap/wrk/.zap/baseline.conf
          FAIL_LEVELS="${{ steps.severity.outputs.fail_levels }}" python3 - <<'PY'
          import json, os, sys
          levels = {"3": "Informational", "2": "Low", "1": "Medium", "0": "High"}
          fail_levels = {item.strip() for item in os.environ["FAIL_LEVELS"].split(",") if item.strip()}
          path = "report_authenticated.json"
          if not os.path.exists(path):
              print("No authenticated JSON report produced; failing closed.", file=sys.stderr)
              sys.exit(1)
          data = json.load(open(path, encoding="utf-8"))
          findings = []
          for site in data.get("site", []):
              for alert in site.get("alerts", []):
                  level = levels.get(str(alert.get("riskcode", "")), alert.get("riskdesc", "").split(" ")[0])
                  if level in fail_levels:
                      findings.append((level, alert.get("alert", "unknown")))
          if findings:
              print("Blocking ZAP findings:", file=sys.stderr)
              for level, name in findings:
                  print(f"- {level}: {name}", file=sys.stderr)
              sys.exit(1)
          print(f"Authenticated ZAP scan passed configured threshold: {', '.join(sorted(fail_levels))}")
          PY

      - name: Remove authentication material
        if: always()
        shell: bash
        run: rm -f .dast-auth.context .dast-context-password .dast-zap.env

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dast-staging-report
          if-no-files-found: ignore
          retention-days: 14
          path: |
            report_html.html
            report_md.md
            report_json.json
            report_authenticated.html
            report_authenticated.md
            report_authenticated.json
            zap-baseline-staging-public/
            zap-baseline-staging-authenticated/
