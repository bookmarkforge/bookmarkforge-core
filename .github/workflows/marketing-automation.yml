# Marketing Automation Workflow
# Runs daily and on push to automate marketing tasks:
# - Social listening (Reddit RSS)
# - Community engagement suggestions
# - Content syndication (when new blog posts)
# - Structured data generation

name: Marketing Automation

on:
  # Run daily at 9 AM UTC
  schedule:
    - cron: '0 9 * * *'

  # Run when blog posts are added/modified
  push:
    paths:
      - 'docs/blog-posts/**'
    branches:
      - main

  # Allow manual trigger
  workflow_dispatch:

jobs:
  social-listening:
    name: Social Listening
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Run social listening
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: npm run marketing:social-listen

      - name: Upload social listening history
        uses: actions/upload-artifact@v4
        with:
          name: social-listening-history
          path: marketing/social-listening-history.json
          retention-days: 30

  community-engagement:
    name: Community Engagement Suggestions
    runs-on: ubuntu-latest
    needs: social-listening
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Download social listening history
        uses: actions/download-artifact@v4
        with:
          name: social-listening-history
          path: marketing/

      - name: Generate response suggestions
        run: npm run marketing:engage

      - name: Upload response suggestions
        uses: actions/upload-artifact@v4
        with:
          name: response-suggestions
          path: marketing/response-suggestions.json
          retention-days: 7

      - name: Create PR with suggestions (optional)
        id: create-pr
        if: false # Disabled by default - enable if you want automatic PRs
        uses: peter-evans/create-pull-request@v6
        with:
          title: 'Marketing: Response suggestions for review'
          body: |
            Automated response suggestions generated by the community engagement script.

            Please review `marketing/response-suggestions.json` and respond manually to the suggestions.

            **IMPORTANT**: Do not post automatically. Review each suggestion before responding.
          branch: marketing/response-suggestions
          delete-branch: true

  content-syndication:
    name: Content Syndication
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Syndicate content
        env:
          DEV_API_KEY: ${{ secrets.DEV_API_KEY }}
          HASHNODE_API_KEY: ${{ secrets.HASHNODE_API_KEY }}
          HASHNODE_PUBLICATION_ID: ${{ secrets.HASHNODE_PUBLICATION_ID }}
        run: npm run marketing:syndicate

      - name: Upload syndication history
        uses: actions/upload-artifact@v4
        with:
          name: syndication-history
          path: marketing/syndication-history.json
          retention-days: 90

  structured-data:
    name: Generate Structured Data
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Generate structured data
        run: npm run generate:structured-data

      - name: Upload structured data
        uses: actions/upload-artifact@v4
        with:
          name: structured-data
          path: public/structured-data.json
          retention-days: 30

      - name: Commit structured data (if changed)
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/structured-data.json
          git diff --staged --quiet || git commit -m "chore: update structured data [skip ci]"
          git push

  marketing-summary:
    name: Marketing Summary
    runs-on: ubuntu-latest
    needs: [social-listening, community-engagement, content-syndication, structured-data]
    if: always()

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Generate summary
        run: |
          echo "## Marketing Automation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Jobs Status" >> $GITHUB_STEP_SUMMARY
          echo "- Social Listening: ${{ needs.social-listening.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Community Engagement: ${{ needs.community-engagement.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Content Syndication: ${{ needs.content-syndication.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Structured Data: ${{ needs.structured-data.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Artifacts" >> $GITHUB_STEP_SUMMARY
          ls -R artifacts/ >> $GITHUB_STEP_SUMMARY || true
