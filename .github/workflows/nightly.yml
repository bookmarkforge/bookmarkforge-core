name: Nightly validation

on:
  schedule:
    # Daily: E2E suites, coverage, trends and consistency reports.
    - cron: '17 2 * * *'
    # Monthly (1st, 03:17 UTC): backup-restore DR drill.
    - cron: '17 3 1 * *'
    # Weekly (Monday, 02:23 UTC): dependency CVE report. The weekly cadence is
    # deliberate — this job publishes a classification, not a signal, and the
    # database of advisories does not move every night.
    - cron: '23 2 * * 1'
  workflow_dispatch:
    inputs:
      test_alert:
        description: 'Send a synthetic test alert to NIGHTLY_ALERT_WEBHOOK_URL'
        type: boolean
        default: false
      smoke_suite:
        description: 'Suite to label the synthetic test alert with'
        type: choice
        default: human-like
        options:
          - human-like
          - multiuser
          - perf-scale

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: true

jobs:
  webhook-smoke:
    # Manual webhook validation: dispatch the workflow with test_alert=true and
    # the job posts a synthetic payload to NIGHTLY_ALERT_WEBHOOK_URL (HTTPS-only)
    # so the alert wiring can be confirmed without waiting for a nightly run.
    # Fails loudly when the webhook is unreachable — smoke tests SHOULD fail.
    name: Webhook smoke test
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_alert }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.17.0'
          cache: npm
      - run: npm ci
      - name: Send synthetic alert to webhook
        env:
          NIGHTLY_ALERT_WEBHOOK_URL: ${{ secrets.NIGHTLY_ALERT_WEBHOOK_URL }}
          NIGHTLY_ALERT_JOB_LABEL: ${{ inputs.smoke_suite }}
        run: node scripts/nightly-alert.mjs --test

  coverage:
    name: Full coverage gates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NODE_ENV: test
      # ADR-019: feeds the codecov badge in README. Step is skipped when the
      # secret is absent, so the nightly never depends on it.
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.17.0'
          cache: npm
      - run: npm ci
      # Assertion-integrity ratchet (docs/PENDIENTES.md P2): this job is the
      # nightly's quality report, so it is where the suite theatre gets
      # reported too — a test that cannot fail is measured here, next to the
      # coverage it fakes. Declared-surface drift (docs/ops-nightly.md §1 vs
      # the tree) fails in the same step.
      - run: node scripts/check-vacuous-tests.mjs
      - run: npm run test:coverage
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nightly-coverage
          if-no-files-found: ignore
          retention-days: 14
          path: |
            coverage/
            coverage-history.json
      - name: Upload coverage to Codecov
        if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f
        with:
          files: coverage/lcov.info
          fail_ci_if_error: false

  multiuser-sharded:
    # Multi-user E2E suite — declared size in docs/ops-nightly.md §1, verified
    # by `npm run check:vacuous-tests` — split into N equal shards by
    # Playwright's NATIVE test-count sharding (--shard=n/N). The suite runs
    # serial (workers=1) and exceeds the 30 min single-job budget, so N=2 keeps
    # each shard around 20-25 min on CI hardware.
    #
    # The blob reporter is enabled (MULTIUSER_BLOB_REPORT) so each shard
    # writes into playwright-report-multiuser-<N> (MULTIUSER_SHARD drives the
    # per-shard output dir in playwright.multiuser.config.ts); the
    # multiuser-report merge job combines them into one unified HTML report.
    name: Multi-user E2E (shard ${{ matrix.shard }}/${{ matrix.total }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
        total: [2]
    env:
      NODE_ENV: test
      VITE_TEST_BUILD: 'true'
      MULTIUSER_BLOB_REPORT: '1'
      MULTIUSER_SHARD: ${{ matrix.shard }}
      # ADR-019: WoW duration budget — per-shard history persisted in cache
      NIGHTLY_MULTIUSER_HISTORY_FILE: .nightly-history/multiuser-shard-${{ matrix.shard }}.jsonl
      # Every fired alert is appended here for the alert-vs-trend consistency
      # report (nightly-consistency job); rides the same .nightly-history cache.
      NIGHTLY_MULTIUSER_ALERT_LOG_FILE: .nightly-history/alerts/multiuser-shard-${{ matrix.shard }}.jsonl
      NIGHTLY_MULTIUSER_DEGRADE_RATIO: ${{ vars.NIGHTLY_MULTIUSER_DEGRADE_RATIO || '1.25' }}
      # Pro-seeding specs (backup/restore) activate through the real signing
      # stack: the companion needs the private key matching the committed
      # public key (empty = 503, specs fail loudly, never silently grant Pro).
      LICENSE_SIGNING_PRIVATE_KEY_PKCS8: ${{ secrets.LICENSE_SIGNING_PRIVATE_KEY_PKCS8 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.17.0'
          cache: npm
      - run: npm ci
      - name: Restore duration history cache (WoW budget)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .nightly-history
          key: nightly-multiuser-history-v1-${{ github.run_id }}
          restore-keys: |
            nightly-multiuser-history-v1-
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      # extension.spec.ts is sharded into this suite and loads dist-extension/
      # (gitignored); build it first or the spec fails asking for it.
      - name: Build browser extension bundle
        run: npm run build:extension:custom
      - name: Run multi-user shard ${{ matrix.shard }}/${{ matrix.total }}
        run: |
          set -o pipefail
          start=$(date +%s)
          npm run e2e:multiuser:shard -- --shard=${{ matrix.shard }}/${{ matrix.total }}
          code=$?
          end=$(date +%s)
          echo "NIGHTLY_MULTIUSER_MINUTES=$(( (end - start) / 60 ))" >> "$GITHUB_ENV"
          exit $code
      - name: Upload multi-user blob report (shard ${{ matrix.shard }})
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: multiuser-blob-${{ matrix.shard }}
          if-no-files-found: ignore
      - name: Alert on failure, over-duration, or week-over-week regression
        if: always()
        env:
          NIGHTLY_ALERT_JOB_LABEL: multiuser
          NIGHTLY_MULTIUSER_STATUS: ${{ job.status }}
          NIGHTLY_MULTIUSER_SHARD: ${{ matrix.shard }}
          NIGHTLY_MULTIUSER_MINUTES: ${{ env.NIGHTLY_MULTIUSER_MINUTES }}
          NIGHTLY_MULTIUSER_MAX_MINUTES: ${{ vars.NIGHTLY_MULTIUSER_MAX_MINUTES }}
          NIGHTLY_ALERT_WEBHOOK_URL: ${{ secrets.NIGHTLY_ALERT_WEBHOOK_URL }}
        run: node scripts/nightly-alert.mjs
      - name: Save duration history cache (WoW budget)
        if: always()
        # Advisory only: a missing history dir (job cancelled before the run
        # step) or a full cache must never flip a passing job to failed.
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .nightly-history
          key: nightly-multiuser-history-v1-${{ github.run_id }}-${{ matrix.shard }}
          retention-days: 7

      - name: Upload multiuser playwright reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playwright-report-multiuser-${{ matrix.shard }}
          if-no-files-found: ignore
          retention-days: 7
          path: playwright-report-multiuser-${{ matrix.shard }}/

  multiuser-report:
    name: Merge multi-user reports
    needs: [multiuser-sharded]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.17.0'
          cache: npm
      - run: npm ci
      - name: Download multi-user blob reports
        if: always()
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: blobs/
          pattern: multiuser-blob-*
          merge-multiple: true
          if-no-files-found: warn
      - name: Merge multi-user reports into one HTML report
        # Resilient merge: skips (exit 0) when no or incomplete blobs — a
        # shard cancelled before its run produces none, and its own job
        # already reports the failure. Only a REAL merge failure exits 1.
        env:
          BLOBS_DIR: blobs
          EXPECTED_SHARDS: '2'
          MERGE_STATUS_FILE: multiuser-merge-status.json
        run: node scripts/merge-nightly-blobs.mjs
      - name: Upload multi-user merge status
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: multiuser-merge-status
          if-no-files-found: ignore
          retention-days: 14
          path: multiuser-merge-status.json
      - name: Upload raw multi-user blob reports (triage evidence)
        # Consolidated copy of the shard blobs, kept alongside the report so
        # a REAL merge failure can be triaged from the raw input (the
        # per-shard artifacts themselves expire after 7 days).
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: multiuser-raw-blobs
          if-no-files-found: ignore
          retention-days: 14
          path: blobs/
      - name: Upload merged multi-user report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nightly-multiuser-report
          if-no-files-found: ignore
          retention-days: 14
          path: playwright-report/

  human-like-sharded:
    # Human-like E2E suite, split into N equal shards by Playwright's NATIVE
    # test-count sharding (--shard=n/N): each shard runs the same fraction of
    # TESTS regardless of which spec file they live in. This balances the wall
    # clock far better than splitting by file (full-coverage-tests alone is
    # ~20 min; bookmark-app only ~6 min), so no single job owns a heavyweight
    # spec.
    #
    # The suite size and its per-shard budget are NOT repeated here: the
    # declared size lives in docs/ops-nightly.md §1 ("Suites and jobs") and
    # `npm run check:vacuous-tests` fails when the tree stops matching it. The
    # numbers that used to sit in this comment ("290 tests in 15 spec files",
    # "~73 tests per shard") were a 7x understatement by 2026-09-24 and no gate
    # re-read them. Bump N (matrix.shard + matrix.total) as the suite grows;
    # the blob-report merge (human-like-report) is shard-agnostic.
    #
    # The blob reporter is enabled (HUMAN_LIKE_BLOB_REPORT) so each shard
    # writes into playwright-report-human-like-<N> (HUMAN_LIKE_SHARD drives
    # the per-shard output dir in playwright.human-like.config.ts); the
    # human-like-report merge job combines them into one unified HTML report.
    name: Human-like E2E (shard ${{ matrix.shard }}/${{ matrix.total }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
        total: [4]
    env:
      NODE_ENV: test
      VITE_TEST_BUILD: 'true'
      HUMAN_LIKE_BLOB_REPORT: '1'
      HUMAN_LIKE_SHARD: ${{ matrix.shard }}
      # ADR-019: WoW duration budget — per-shard history persisted in cache
      NIGHTLY_HUMAN_LIKE_HISTORY_FILE: .nightly-history/human-like-shard-${{ matrix.shard }}.jsonl
      # Every fired alert is appended here for the alert-vs-trend consistency
      # report (nightly-consistency job); rides the same .nightly-history cache.
      NIGHTLY_HUMAN_LIKE_ALERT_LOG_FILE: .nightly-history/alerts/human-like-shard-${{ matrix.shard }}.jsonl
      NIGHTLY_HUMAN_LIKE_DEGRADE_RATIO: ${{ vars.NIGHTLY_HUMAN_LIKE_DEGRADE_RATIO || '1.25' }}
      # Pro-seeding specs (backup/restore) activate through the real signing
      # stack: the companion needs the private key matching the committed
      # public key (empty = 503, specs fail loudly, never silently grant Pro).
      LICENSE_SIGNING_PRIVATE_KEY_PKCS8: ${{ secrets.LICENSE_SIGNING_PRIVATE_KEY_PKCS8 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.17.0'
          cache: npm
      - run: npm ci
      - name: Restore duration history cache (WoW budget)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .nightly-history
          key: nightly-human-like-history-v1-${{ github.run_id }}
          restore-keys: |
            nightly-human-like-history-v1-
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      # extension.spec.ts is sharded into this suite and loads dist-extension/
      # (gitignored); build it first or the spec fails asking for it.
      - name: Build browser extension bundle
        run: npm run build:extension:custom
      - name: Run human-like shard ${{ matrix.shard }}/${{ matrix.total }}
        run: |
          set -o pipefail
          start=$(date +%s)
          npm run test:human -- --shard=${{ matrix.shard }}/${{ matrix.total }}
          code=$?
          end=$(date +%s)
          echo "NIGHTLY_HUMAN_LIKE_MINUTES=$(( (end - start) / 60 ))" >> "$GITHUB_ENV"
          exit $code
      - name: Upload human-like blob report (shard ${{ matrix.shard }})
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: human-like-blob-${{ matrix.shard }}
          if-no-files-found: error
          retention-days: 7
          path: playwright-report-human-like-${{ matrix.shard }}/
      - name: Alert on failure, over-duration, or week-over-week regression
        if: always()
        env:
          NIGHTLY_HUMAN_LIKE_STATUS: ${{ job.status }}
          NIGHTLY_HUMAN_LIKE_SHARD: ${{ matrix.shard }}
          NIGHTLY_HUMAN_LIKE_MINUTES: ${{ env.NIGHTLY_HUMAN_LIKE_MINUTES }}
          NIGHTLY_HUMAN_LIKE_MAX_MINUTES: ${{ vars.NIGHTLY_HUMAN_LIKE_MAX_MINUTES }}
          NIGHTLY_ALERT_WEBHOOK_URL: ${{ secrets.NIGHTLY_ALERT_WEBHOOK_URL }}
        run: node scripts/nightly-alert.mjs
      - name: Save duration history cache (WoW budget)
        if: always()
        # Advisory only: a missing history dir (job cancelled before the run
        # step) or a full cache must never flip a passing job to failed.
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .nightly-history
          key: nightly-human-like-history-v1-${{ github.run_id }}-${{ matrix.shard }}

  human-like-report:
    name: Merge human-like reports
    needs: [human-like-sharded]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.17.0'
          cache: npm
      - run: npm ci
      - name: Download human-like blob reports
        if: always()
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: blobs/
          pattern: human-like-blob-*
          merge-multiple: true
          if-no-files-found: warn
      - name: Merge human-like reports into one HTML report
        # Resilient merge: skips (exit 0) when no or incomplete blobs — a
        # shard cancelled before its run produces none, and its own job
        # already reports the failure. Only a REAL merge failure exits 1.
        env:
          BLOBS_DIR: blobs
          EXPECTED_SHARDS: '4'
          MERGE_STATUS_FILE: human-like-merge-status.json
        run: node scripts/merge-nightly-blobs.mjs
      - name: Upload human-like merge status
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: human-like-merge-status
          if-no-files-found: ignore
          retention-days: 14
          path: human-like-merge-status.json
      - name: Upload raw human-like blob reports (triage evidence)
        # Consolidated copy of the shard blobs, kept alongside the report so
        # a REAL merge failure can be triaged from the raw input (the
        # per-shard artifacts themselves expire after 7 days).
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: human-like-raw-blobs
          if-no-files-found: ignore
          retention-days: 14
          path: blobs/
      - name: Upload merged human-like report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nightly-human-like-report
          if-no-files-found: ignore
          retention-days: 14
          path: playwright-report/

  nightly-trends:
    # Aggregates the per-suite WoW duration histories (JSONL from the Actions
    # cache) into CSV evidence artifacts. Runs after both merge jobs so all
    # suites have recorded their samples this run. Advisory except for one
    # fail-loud gate: a suite whose median trips the degradation criterion
    # (>= 1.25x previous week) for TRENDS_MIN_CONSECUTIVE_DEGRADED consecutive
    # weeks (default 3, repo var; 0 disables) turns the job red — sustained
    # trends are a real signal, not noise. A missing history just yields a
    # header-only CSV.
    name: Nightly WoW trends report
    needs: [multiuser-report, human-like-report]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Global sustained-degradation gate (consecutive weeks); per-suite repo
      # vars TRENDS_MIN_CONSECUTIVE_DEGRADED_<SUITE> (upper-snaked, e.g.
      # HUMAN_LIKE) override it per suite, so human-like / multiuser /
      # perf-scale can have different N thresholds.
      TRENDS_MIN_CONSECUTIVE_DEGRADED: ${{ vars.TRENDS_MIN_CONSECUTIVE_DEGRADED || '3' }}
      TRENDS_MIN_CONSECUTIVE_DEGRADED_HUMAN_LIKE: ${{ vars.TRENDS_MIN_CONSECUTIVE_DEGRADED_HUMAN_LIKE || vars.TRENDS_MIN_CONSECUTIVE_DEGRADED || '3' }}
      TRENDS_MIN_CONSECUTIVE_DEGRADED_MULTIUSER: ${{ vars.TRENDS_MIN_CONSECUTIVE_DEGRADED_MULTIUSER || vars.TRENDS_MIN_CONSECUTIVE_DEGRADED || '3' }}
      TRENDS_MIN_CONSECUTIVE_DEGRADED_PERF_SCALE: ${{ vars.TRENDS_MIN_CONSECUTIVE_DEGRADED_PERF_SCALE || vars.TRENDS_MIN_CONSECUTIVE_DEGRADED || '3' }}
      # Optional SVG embed in the job summary: an https URL where the chart is
      # reachable (signed artifact URL or private host). GitHub sanitizes
      # inline data URIs in summaries, so a real URL is required; unset keeps
      # the summary to raw-data links (nothing leaves the repo).
      TRENDS_SVG_PUBLIC_URL: ${{ vars.TRENDS_SVG_PUBLIC_URL || '' }}
      # Two-phase presigned-URL embed: when TRENDS_SVG_BUCKET is set, the first
      # pass defers the summary (TRENDS_DEFER_SUMMARY=1), the Sign SVG step
      # uploads the chart to the private bucket and presigns it, and the final
      # pass rewrites the summary with the URL (TRENDS_SUMMARY_ONLY=1). The
      # artifact itself stays private — only the short-lived signed URL leaks.
      TRENDS_DEFER_SUMMARY: ${{ vars.TRENDS_SVG_BUCKET != '' && '1' || '' }}
      TRENDS_SVG_BUCKET: ${{ vars.TRENDS_SVG_BUCKET || '' }}
      # Shared alert webhook: on sustained degradation the job posts a
      # nightly_trends_sustained alert (best-effort, never affects exit code).
      NIGHTLY_ALERT_WEBHOOK_URL: ${{ secrets.NIGHTLY_ALERT_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.17.0'
          cache: npm
      - run: npm ci
      - name: Restore duration history cache (WoW trends)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .nightly-history
          key: nightly-trends-${{ github.run_id }}
          restore-keys: |
            nightly-human-like-history-v1-
            nightly-multiuser-history-v1-
            nightly-perf-scale-history-v1-
      - name: Build nightly trends CSV
        run: node scripts/nightly-trends.mjs
      - name: Sign SVG URL (private bucket)
        # Upload the SVG to the private bucket and mint a short-lived presigned
        # URL so the job summary can embed the chart without publishing the
        # artifact. Best-effort: a bucket misconfiguration must not red the job.
        if: ${{ always() && vars.TRENDS_SVG_BUCKET != '' }}
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          TRENDS_SVG_BUCKET: ${{ vars.TRENDS_SVG_BUCKET }}
          TRENDS_SVG_OBJECT_KEY: nightly/trends-${{ github.run_id }}.svg
          TRENDS_SVG_PRESIGN_EXPIRES: ${{ vars.TRENDS_SVG_PRESIGN_EXPIRES || '3600' }}
        run: |
          set -euo pipefail
          aws s3 cp nightly-trends.svg "s3://${TRENDS_SVG_BUCKET}/${TRENDS_SVG_OBJECT_KEY}" --acl private --no-progress
          PRESIGNED="$(aws s3 presign "s3://${TRENDS_SVG_BUCKET}/${TRENDS_SVG_OBJECT_KEY}" --expires-in "${TRENDS_SVG_PRESIGN_EXPIRES}")"
          echo "TRENDS_SVG_PUBLIC_URL=${PRESIGNED}" >> "$GITHUB_ENV"
      - name: Rewrite job summary with embedded SVG
        # Phase 2 of the presigned-URL embed: rewrite the summary (and its md
        # artifact copy) with the signed URL now in the environment. Never
        # re-runs the gate/alerts; always exits 0 (display sugar only).
        if: ${{ always() && vars.TRENDS_SVG_BUCKET != '' }}
        env:
          TRENDS_SUMMARY_ONLY: '1'
        run: node scripts/nightly-trends.mjs
      - name: Upload nightly trends report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nightly-trends
          if-no-files-found: ignore
          retention-days: 90
          path: |
            nightly-trends.csv
            nightly-trends-summary.csv
            nightly-trends-summary.md
            nightly-trends.svg

  nightly-consistency:
    # Cross-checks the trend summary's degradedWoW (per suite+week, recomputed
    # with the same summarizeEntries that builds the summary CSV) against the
    # alert log that nightly-alert.mjs appends to whenever an alert fires.
    # The report flags missed-alert (suite DEGRADED with no shard WoW alert,
    # possibly a median-aggregation artifact) and phantom-alert (WoW alerts
    # without suite-level corroboration). Advisory EXCEPT for one fail-loud
    # gate: CONSISTENCY_MIN_CONSECUTIVE_PHANTOM (default 2, repo var; 0
    # disables) consecutive phantom-alert weeks in the same suite turn the
    # job red — repeated phantoms hint at a bug in the degradation criterion.
    name: Nightly alert-vs-trend consistency
    needs: [nightly-trends]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CONSISTENCY_MIN_CONSECUTIVE_PHANTOM: ${{ vars.CONSISTENCY_MIN_CONSECUTIVE_PHANTOM || '2' }}
      # Opt-in SVG embed in the job summary: GitHub strips inline data URIs,
      # so the chart only renders when a public/signed https URL is provided.
      CONSISTENCY_SVG_PUBLIC_URL: ${{ vars.CONSISTENCY_SVG_PUBLIC_URL || '' }}
      # Two-phase presigned-URL embed (same pattern as nightly-trends): when
      # CONSISTENCY_SVG_BUCKET is set, the first pass defers the summary, the
      # Sign SVG step uploads the chart to the private bucket and presigns it,
      # and the final pass rewrites the summary with the URL.
      CONSISTENCY_DEFER_SUMMARY: ${{ vars.CONSISTENCY_SVG_BUCKET != '' && '1' || '' }}
      CONSISTENCY_SVG_BUCKET: ${{ vars.CONSISTENCY_SVG_BUCKET || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.17.0'
          cache: npm
      - run: npm ci
      - name: Restore duration history cache (alert log + trends)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .nightly-history
          key: nightly-consistency-${{ github.run_id }}
          restore-keys: |
            nightly-human-like-history-v1-
            nightly-multiuser-history-v1-
            nightly-perf-scale-history-v1-
      - name: Build nightly alert-vs-trend consistency report
        run: node scripts/nightly-consistency.mjs
      - name: Sign SVG URL (private bucket)
        # Upload the consistency bar chart to the private bucket and mint a
        # short-lived presigned URL so the job summary can embed it without
        # publishing the artifact. Best-effort: a bucket misconfiguration must
        # not red the job.
        if: ${{ always() && vars.CONSISTENCY_SVG_BUCKET != '' }}
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          CONSISTENCY_SVG_BUCKET: ${{ vars.CONSISTENCY_SVG_BUCKET }}
          CONSISTENCY_SVG_OBJECT_KEY: nightly/consistency-${{ github.run_id }}.svg
          CONSISTENCY_SVG_PRESIGN_EXPIRES: ${{ vars.CONSISTENCY_SVG_PRESIGN_EXPIRES || '3600' }}
        run: |
          set -euo pipefail
          aws s3 cp nightly-consistency.svg "s3://${CONSISTENCY_SVG_BUCKET}/${CONSISTENCY_SVG_OBJECT_KEY}" --acl private --no-progress
          PRESIGNED="$(aws s3 presign "s3://${CONSISTENCY_SVG_BUCKET}/${CONSISTENCY_SVG_OBJECT_KEY}" --expires-in "${CONSISTENCY_SVG_PRESIGN_EXPIRES}")"
          echo "CONSISTENCY_SVG_PUBLIC_URL=${PRESIGNED}" >> "$GITHUB_ENV"
      - name: Rewrite job summary with embedded SVG
        # Phase 2 of the presigned-URL embed: rewrite the summary with the
        # signed URL now in the environment. Never re-runs the gate; always
        # exits 0 (display sugar only).
        if: ${{ always() && vars.CONSISTENCY_SVG_BUCKET != '' }}
        env:
          CONSISTENCY_SUMMARY_ONLY: '1'
        run: node scripts/nightly-consistency.mjs
      - name: Upload nightly consistency report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nightly-consistency
          if-no-files-found: ignore
          retention-days: 90
          path: |
            nightly-consistency.csv
            nightly-consistency.json
            nightly-consistency.svg

  performance:
    # Performance and scale E2E suite (perf-scale.nightly.spec.ts). Not
    # sharded — a single job — but it gets the same WoW duration budget as the
    # sharded suites: NIGHTLY_ALERT_JOB_LABEL=perf-scale selects the
    # NIGHTLY_PERF_SCALE_* env family in scripts/nightly-alert.mjs.
    name: Performance and scale E2E
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NODE_ENV: test
      VITE_TEST_BUILD: 'true'
      # ADR-019: WoW duration budget — single-job history persisted in cache
      NIGHTLY_PERF_SCALE_HISTORY_FILE: .nightly-history/perf-scale.jsonl
      # Every fired alert is appended here for the alert-vs-trend consistency
      # report (nightly-consistency job); rides the same .nightly-history cache.
      NIGHTLY_PERF_SCALE_ALERT_LOG_FILE: .nightly-history/alerts/perf-scale.jsonl
      NIGHTLY_PERF_SCALE_DEGRADE_RATIO: ${{ vars.NIGHTLY_PERF_SCALE_DEGRADE_RATIO || '1.25' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.17.0'
          cache: npm
      - run: npm ci
      - name: Restore duration history cache (WoW budget)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .nightly-history
          key: nightly-perf-scale-history-v1-${{ github.run_id }}
          restore-keys: |
            nightly-perf-scale-history-v1-
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run performance suite
        run: |
          set -o pipefail
          start=$(date +%s)
          npm run e2e:nightly -- tests/e2e/perf-scale.nightly.spec.ts
          code=$?
          end=$(date +%s)
          echo "NIGHTLY_PERF_SCALE_MINUTES=$(( (end - start) / 60 ))" >> "$GITHUB_ENV"
          exit $code
      - name: Upload performance artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nightly-performance
          if-no-files-found: ignore
          retention-days: 14
          path: |
            test-results/
            playwright-report-nightly/
            playwright-report/
      - name: Alert on failure, over-duration, or week-over-week regression
        if: always()
        env:
          NIGHTLY_ALERT_JOB_LABEL: perf-scale
          NIGHTLY_PERF_SCALE_STATUS: ${{ job.status }}
          NIGHTLY_PERF_SCALE_SHARD: single
          NIGHTLY_PERF_SCALE_MINUTES: ${{ env.NIGHTLY_PERF_SCALE_MINUTES }}
          NIGHTLY_PERF_SCALE_MAX_MINUTES: ${{ vars.NIGHTLY_PERF_SCALE_MAX_MINUTES }}
          NIGHTLY_ALERT_WEBHOOK_URL: ${{ secrets.NIGHTLY_ALERT_WEBHOOK_URL }}
        run: node scripts/nightly-alert.mjs
      - name: Save duration history cache (WoW budget)
        if: always()
        # Advisory only: a missing history dir (job cancelled before the run
        # step) or a full cache must never flip a passing job to failed.
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .nightly-history
          key: nightly-perf-scale-history-v1-${{ github.run_id }}

  embedding-quality:
    # Compare the pinned q8 production baseline with the uint8 candidate in a
    # real Chromium/WASM runtime. This is intentionally nightly-only because
    # it downloads both model variants and fails on retrieval-quality drift.
    name: Embedding model quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_ENV: test
      VITE_TEST_BUILD: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.17.0'
          cache: npm
      - run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run embedding quality gate
        run: npm run e2e:nightly -- tests/e2e/embedding-quality.nightly.spec.ts
      - name: Upload embedding quality evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: embedding-quality
          if-no-files-found: ignore
          retention-days: 30
          path: |
            test-results/
            playwright-report-nightly/
            playwright-report/

  sw-integrity-tamper:
    # ADR-039 browser-level proof: build the gated production artifact
    # (build:ci) and run the SW integrity tamper suite against a real
    # Chromium — tampered precache and runtime-cache entries must be 504'd
    # and evicted, and unlisted paths must pass through untouched. The
    # synthetic runtime tests cannot see the real Workbox precache/
    # StaleWhileRevalidate wiring, so this job is the end-to-end contract.
    name: SW integrity tamper (browser)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.17.0'
          cache: npm
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      # Own port: every other Playwright profile in this repo defaults to
      # 4173, and a fresh runner still managed to find it busy (run
      # 35833219915, "http://127.0.0.1:4173 is already used") — likely a
      # leaked preview from an earlier step in this same job. The config's
      # PLAYWRIGHT_PORT escape hatch exists for exactly this; 4732 is not
      # used by any other profile, server or battery in the repo.
      - name: Build production bundle and run SW integrity tamper suite
        env:
          PLAYWRIGHT_PORT: 4732
        run: npm run e2e:sw-integrity
      - name: Upload tamper evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sw-integrity-tamper
          if-no-files-found: ignore
          retention-days: 14
          path: |
            test-results/
            playwright-report/

  launch-readiness:
    name: Launch checklist blockers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.17.0'
          cache: npm
      - name: Enforce launch checklist blockers (strict)
        run: npm run check:launch-checklist:strict

  load-test:
    name: Companion server load test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.17.0'
          cache: npm
      - run: npm ci
      - name: Run companion server load test (WS + SLO gates)
        run: node scripts/load-test-server.mjs --connections=50 --json

  kpi-staging:
    name: Business KPIs (staging) with thresholds
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: true
      # Pre-launch pause switch: both empty until staging is configured.
      # (Secrets are not allowed in `if:` — promote to env and test env.)
      KPI_STAGING_URL: ${{ vars.STAGING_URL }}
      KPI_STAGING_READY: ${{ secrets.STAGING_ANALYTICS_ADMIN_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.17.0'
          cache: npm
      - run: npm ci
      # Pre-launch: no staging deployment exists yet, so there is nothing to
      # measure. Pause the gate (skip) instead of failing red; set STAGING_URL
      # + STAGING_ANALYTICS_ADMIN_TOKEN to enable it at launch.
      - name: Run business KPI gate against staging
        if: ${{ env.KPI_STAGING_URL != '' && env.KPI_STAGING_READY != '' }}
        env:
          ANALYTICS_BASE_URL: ${{ vars.STAGING_URL }}
          ANALYTICS_ADMIN_TOKEN: ${{ secrets.STAGING_ANALYTICS_ADMIN_TOKEN }}
          # Thresholds (repo vars, opcionales; sin configurar = solo informe):
          # KPI_MIN_DAU / KPI_MIN_WAU / KPI_MIN_MAU (enteros ≥ 0) y
          # KPI_MIN_D7_PCT / KPI_MIN_D30_PCT (proporción 0..1). Un valor por
          # debajo del umbral hace fallar el job (página durable) y dispara el
          # webhook ANALYTICS_ALERT_WEBHOOK_URL si está configurado.
          KPI_MIN_DAU: ${{ vars.KPI_MIN_DAU }}
          KPI_MIN_WAU: ${{ vars.KPI_MIN_WAU }}
          KPI_MIN_MAU: ${{ vars.KPI_MIN_MAU }}
          KPI_MIN_D7_PCT: ${{ vars.KPI_MIN_D7_PCT }}
          KPI_MIN_D30_PCT: ${{ vars.KPI_MIN_D30_PCT }}
          ANALYTICS_ALERT_WEBHOOK_URL: ${{ secrets.ANALYTICS_ALERT_WEBHOOK_URL }}
        shell: bash
        run: |
          set -o pipefail
          node scripts/kpi-report.mjs --json 2>&1 | tee kpi-report.json
      - name: KPI gate paused (no staging configured)
        if: ${{ env.KPI_STAGING_URL == '' || env.KPI_STAGING_READY == '' }}
        run: 'echo "kpi-staging paused (staging is not configured yet)"'
      - name: Upload KPI report evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kpi-report-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 30
          path: kpi-report.json


  dependency-cve-report:
    # Weekly visibility for the dependency advisory classification: which
    # advisories sit on a package `package.json` declares (`own`) and which only
    # arrive through one (`inherited`, with the direct dependency it comes
    # through and the minimal bump that clears it). The CI gate only speaks when
    # it FAILS — `npm run check` prints one ok line when the tree is clean — so
    # without this job the classification is invisible exactly when the tree is
    # clean, which is most weeks. Runs on the Monday cron and on manual
    # dispatch; both audit profiles are published because the gate covers prod
    # inside `npm run check` and dev in its own CI step.
    name: Dependency CVE report (weekly)
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.schedule, '23 2 * * 1') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.17.0'
          cache: npm
      - run: npm ci
      - name: Build the dependency CVE report (prod + dev)
        # Read-only digests of package.json + package-lock.json + the registry:
        # no secrets, no deployment surface, nothing written outside the two
        # report pairs. Report mode never gates, so the exit code here is about
        # the audit being runnable at all (it fails closed otherwise).
        # `--step-summary` puts the same tables in the run summary, so the
        # own-vs-inherited split is readable without downloading the artifact.
        run: |
          node scripts/check-direct-cve.mjs --report dependency-cve-report-prod.md --step-summary
          node scripts/check-direct-cve.mjs --include-dev --report dependency-cve-report-dev.md --step-summary
      - name: Upload dependency CVE report
        # The artifact IS the deliverable, so a missing report is a real
        # failure (`error`) rather than background noise. 90 days keeps a full
        # quarter of weekly reports comparable.
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nightly-dependency-cve-report
          if-no-files-found: error
          retention-days: 90
          path: |
            dependency-cve-report-prod.md
            dependency-cve-report-prod.json
            dependency-cve-report-dev.md
            dependency-cve-report-dev.json

  drill-backup-restore:
    name: Backup-restore DR drill (monthly)
    # Runs monthly (1st of month, 03:17 UTC) via the extra schedule entry, and
    # on manual dispatch. The RTO gate (<120s) is enforced by the drill script;
    # if a restore passes the gate but exceeds the warning threshold the script
    # pages DRILL_ALERT_WEBHOOK_URL (HTTPS).
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.schedule, '17 3 1') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: test
      VITE_TEST_BUILD: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.17.0'
          cache: npm
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run backup-restore DR drill (RTO gate + degradation alert)
        env:
          DRILL_RTO_MS: ${{ vars.DRILL_RTO_MS }}
          DRILL_RTO_WARN_MS: ${{ vars.DRILL_RTO_WARN_MS }}
          DRILL_ALERT_WEBHOOK_URL: ${{ secrets.DRILL_ALERT_WEBHOOK_URL }}
        run: node scripts/drill-backup-restore.mjs --json
      - name: Upload drill evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: drill-backup-restore-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 90
          path: |
            test-results/
