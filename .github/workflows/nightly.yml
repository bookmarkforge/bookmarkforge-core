name: Nightly validation

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: true

jobs:
  coverage:
    name: Full coverage gates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20.19.0'
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nightly-coverage
          if-no-files-found: ignore
          retention-days: 14
          path: |
            coverage/
            coverage-history.json

  multiuser:
    name: Multi-user E2E
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NODE_ENV: test
      VITE_TEST_BUILD: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20.19.0'
          cache: npm
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run multi-user suite
        run: npm run e2e:multiuser
      - name: Upload multi-user artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nightly-multiuser
          if-no-files-found: ignore
          retention-days: 14
          path: |
            test-results/
            playwright-report-multiuser/
            playwright-report/

  performance:
    name: Performance and scale E2E
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NODE_ENV: test
      VITE_TEST_BUILD: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20.19.0'
          cache: npm
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run performance suite
        run: npm run e2e:nightly -- tests/e2e/perf-scale.nightly.spec.ts
      - name: Upload performance artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nightly-performance
          if-no-files-found: ignore
          retention-days: 14
          path: |
            test-results/
            playwright-report-nightly/
            playwright-report/

  launch-readiness:
    name: Launch checklist blockers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20.19.0'
          cache: npm
      - name: Enforce launch checklist blockers (strict)
        run: npm run check:launch-checklist:strict

  load-test:
    name: Companion server load test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20.19.0'
          cache: npm
      - run: npm ci
      - name: Run companion server load test (WS + SLO gates)
        run: node scripts/load-test-server.mjs --connections=50 --json
