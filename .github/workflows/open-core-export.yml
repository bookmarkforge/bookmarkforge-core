# Open Core export verification.
#
# Why this exists: the public repository is produced by the private one via
# scripts/export-public-repo.mjs — the export is an artefact, not a checkout
# anyone edits directly. An export can therefore break silently: a Core import
# starts pointing at a Pro module with no placeholder pair, the generated
# declarations stop matching the product's type surface, or a gate in the
# reduced tree starts failing for reasons the private tree cannot see. The
# exporter's own post-export checks catch some of this, but only when someone
# remembers to run the exporter.
#
# This workflow makes the failure loud: on every push and PR it materializes
# the export, then — inside the materialized tree, with its own fresh install —
# runs the open-core gate, the TypeScript compiler, the production build and a
# curated test selection. The boundary cannot drift without a red check.
#
# This workflow is private-repo machinery (it runs the exporter itself), so the
# exporter de-scopes it from the public tree alongside the staging/nightly
# workflows it already removes.

name: Open Core export verification

on:
  push:
    branches: [main, master, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: open-core-export-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  NODE_ENV: test
  # Where the exporter materializes the public tree. A dot-directory keeps the
  # in-export steps from resolving tooling anywhere but the private install
  # until the export has its own node_modules.
  EXPORT_DIR: .open-core-export-verify

jobs:
  export-and-verify:
    if: ${{ hashFiles('scripts/export-public-repo.mjs') != '' }}
    name: Materialize export, typecheck, build and test inside it
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.17.0'
          cache: npm

      # The exporter itself needs the private dev tree: tsc for declaration
      # emit, eslint for the docs-markdown baseline it regenerates.
      - name: Install private dependencies
        run: npm ci

      # Materialize the public tree. The exporter runs its own inline gates
      # (secret scan, docs baseline, claim drift, Pro boundary verification,
      # open-core manifest check) and exits non-zero on any of them, so this
      # single step already blocks a leak or an unbuildable boundary.
      - name: Materialize the Open Core export
        run: node scripts/export-public-repo.mjs --out "$EXPORT_DIR"

      # Independent re-verification of the boundary in the materialized tree —
      # the same gate the public repo's own CI runs against itself.
      - name: Verify the Open Core boundary
        run: node scripts/check-open-core-export.mjs "$EXPORT_DIR"

      # From here on, every step runs INSIDE the export with its own install,
      # so a dependency that only resolves through the private tree fails here
      # instead of in a user's clone.
      - name: Install dependencies inside the export
        working-directory: ${{ env.EXPORT_DIR }}
        run: npm ci

      # Same runtime-boundary audit the public repo's CI runs on itself:
      # a new static Pro import in Core (outside the pro-access seam) fails
      # here before it can reach the public tree.
      - name: Verify the runtime Pro boundary inside the export
        working-directory: ${{ env.EXPORT_DIR }}
        run: node scripts/check-pro-imports.mjs

      - name: Typecheck the exported Core
        working-directory: ${{ env.EXPORT_DIR }}
        run: npm run typecheck

      - name: Build the exported Core
        working-directory: ${{ env.EXPORT_DIR }}
        run: npm run build

      # Curated in-export suite: the database layer (schema, encryption,
      # migrations — the deepest Core surface) plus every gate-contract test
      # the export ships. The private repo's full suite stays in ci.yml; this
      # job answers one question — does the public tree, alone, still work?
      - name: Run the in-export test selection
        working-directory: ${{ env.EXPORT_DIR }}
        run: npx vitest run src/tests/db scripts/__tests__

      - name: Clean up the materialized export
        if: always()
        run: rm -rf "$EXPORT_DIR"
