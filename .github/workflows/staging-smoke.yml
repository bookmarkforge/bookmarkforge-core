name: Staging smoke tests

on:
  workflow_dispatch:
    inputs:
      staging_url:
        description: 'HTTPS URL del staging recién desplegado'
        required: true
        type: string
      image_tag:
        description: 'Tag/SHA desplegado, sólo para trazabilidad'
        required: true
        type: string
  workflow_call:
    inputs:
      staging_url:
        required: true
        type: string
      image_tag:
        required: true
        type: string
    secrets:
      STAGING_SMOKE_TOKEN:
        required: false
      STAGING_SMOKE_ADMIN_TOKEN:
        required: false

permissions:
  contents: read

env:
  CI: true
  STAGING_URL: ${{ inputs.staging_url }}
  IMAGE_TAG: ${{ inputs.image_tag }}

jobs:
  smoke:
    name: Post-deploy staging smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Validate staging target
        shell: bash
        run: |
          set -euo pipefail
          url="${STAGING_URL:-}"
          tag="${IMAGE_TAG:-}"
          [[ "$url" == https://* ]] || { echo "staging_url must use HTTPS" >&2; exit 1; }
          host="${url#https://}"; host="${host%%/*}"
          [[ "$host" != *:* ]] || { echo "staging_url must not include a port" >&2; exit 1; }
          case "$host" in
            bookmarkforge.com|www.bookmarkforge.com|api.bookmarkforge.com|signal.bookmarkforge.com)
              echo "Refusing production target: $host" >&2; exit 1 ;;
          esac
          [[ "$host" == *staging* || "$host" == *-stage* || "$host" == *.test.* ]] || {
            echo "URL host does not identify staging" >&2; exit 1;
          }
          [[ "$tag" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "Invalid image tag" >&2; exit 1; }
          echo "Testing staging target $url (image tag $tag)"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20.19.0'
          cache: npm
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: HTTP security and health checks
        env:
          STAGING_URL: ${{ env.STAGING_URL }}
        run: npm run check:staging-http
      - name: Health and staging smoke
        env:
          PROD_BASE_URL: ${{ env.STAGING_URL }}
          STAGING_SMOKE_TOKEN: ${{ secrets.STAGING_SMOKE_TOKEN }}
          STAGING_SMOKE_ADMIN_TOKEN: ${{ secrets.STAGING_SMOKE_ADMIN_TOKEN }}
        run: npm run production-smoke
      - name: Verify protected client-events diagnostics
        if: ${{ secrets.STAGING_SMOKE_ADMIN_TOKEN != '' }}
        env:
          STAGING_URL: ${{ env.STAGING_URL }}
          CLIENT_EVENTS_ADMIN_TOKEN: ${{ secrets.STAGING_SMOKE_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 20 \
            -H "x-client-events-admin-token: $CLIENT_EVENTS_ADMIN_TOKEN" \
            "$STAGING_URL/api/client-events")"
          unset CLIENT_EVENTS_ADMIN_TOKEN
          [[ "$status" == "200" ]] || { echo "client-events diagnostics returned HTTP $status" >&2; exit 1; }
      - name: Playwright staging smoke
        env:
          PLAYWRIGHT_BASE_URL: ${{ env.STAGING_URL }}
        run: npx playwright test --config=playwright.config.ts tests/e2e/vault-init.spec.ts tests/e2e/a11y.spec.ts
      - name: Upload smoke diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: staging-smoke-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            test-results/
            playwright-report/

  rollback-manual:
    name: Manual rollback instructions
    needs: smoke
    if: failure() && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Print rollback procedure
        shell: bash
        run: |
          cat <<'EOF'
          Smoke tests failed. No rollback was performed automatically.

          Manual rollback:
            1. Confirm the incident and stop further releases.
            2. Select the last validated prod-* tag/image SHA.
            3. Run the approved deployment rollback procedure:
               node scripts/staging-rollback.mjs
            4. Verify /health and run production-smoke against staging/target.
            5. Record the incident, image tag, logs and final decision.

          Never use :latest for rollback and never run this procedure against
          production without the required operator approval.
          EOF
