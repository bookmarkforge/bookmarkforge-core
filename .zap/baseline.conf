# ZAP baseline policy for BookmarkForge.
# Used by both staging DAST (dast-nightly.yml) and production pen-test (pen-test.yml).
# FAIL_ACTION is enforced by the workflow after normalizing the JSON report.
# Critical/High block; Medium is reported but does not block; Low/Informational
# are retained for review.
# Comma-separated ZAP risk names. Only FAIL_LEVELS block the workflow.
FAIL_LEVELS=High,Critical
WARN_LEVELS=Medium,Low,Informational
IGNORE_FILE=.zap/rules.tsv
# Production-specific: no additional ignores. Every High/Critical must be fixed.
# Staging-specific exceptions are in .zap/rules.tsv.
