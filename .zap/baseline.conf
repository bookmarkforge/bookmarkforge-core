# ZAP baseline policy — BookmarkForge (OWASP ZAP baseline / DAST).
#
# The scan fails the pipeline on High and Critical findings. Medium and
# below are reported and reviewed weekly (Security Champions), never
# silently ignored: each accepted rule lives in the reviewed ignore file
# with its reason, and that file is what the scan reads.
FAIL_LEVELS=Critical,High
WARN_LEVELS=Medium,Low,Informational
IGNORE_FILE=.zap/rules.tsv
