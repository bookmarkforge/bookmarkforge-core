<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Save to BookmarkForge</title>
  <link rel="stylesheet" href="brand-tokens.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="header">
    <svg class="logo" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <rect width="128" height="128" rx="24" fill="#0f1c2e"/>
      <path d="M28 40h72l-10 48H38L28 40Z" fill="#00aeef" opacity="0.9"/>
      <path d="M38 56h52l-8 32H46l-8-32Z" fill="#ffffff" opacity="0.15"/>
      <circle cx="64" cy="64" r="12" fill="#00aeef"/>
    </svg>
    <span class="brand">BookmarkForge</span>
  </header>

  <main>
    <section class="card" aria-labelledby="cardLabel pageTitle" aria-describedby="pageUrl">
      <div class="card-label" id="cardLabel">Page to save</div>
      <div class="card-title" id="pageTitle">Loading...</div>
      <div class="card-url" id="pageUrl">...</div>
    </section>

    <button class="btn" id="saveBtn" aria-describedby="saveHint">
      Save to BookmarkForge
    </button>
    <div id="saveHint" class="visually-hidden">
      Opens BookmarkForge in a new tab to save the current page.
    </div>

    <div
      id="status"
      class="status"
      hidden
      role="status"
      aria-live="polite"
    ></div>

    <button
      class="settings-toggle"
      id="settingsToggle"
      aria-expanded="false"
      aria-controls="settingsPanel"
    >
      ⚙ Settings
    </button>

    <div class="settings-panel" id="settingsPanel" role="region" aria-labelledby="settingsLabel">
      <div class="settings-label" id="settingsLabel">BookmarkForge URL</div>
      <div class="settings-current">
        Current: <span id="currentUrlDisplay">…</span>
      </div>
      <input
        type="url"
        class="settings-input"
        id="customUrlInput"
        placeholder="https://bookmarkforge.com"
        autocomplete="off"
        spellcheck="false"
      >
      <div class="button-row">
        <button class="settings-btn" id="saveUrlBtn">Save</button>
        <button
          class="settings-btn settings-btn-secondary"
          id="resetUrlBtn"
          title="Reset to default"
        >
          Reset
        </button>
      </div>
      <div
        id="urlStatus"
        class="url-status"
        hidden
        role="status"
        aria-live="polite"
      ></div>
    </div>
  </main>

  <footer class="footer">
    <a href="https://bookmarkforge.com/privacy-and-terms.html" target="_blank" rel="noopener noreferrer">
      Privacy Policy
    </a>
  </footer>

  <script src="capture-url.js"></script>
  <script src="popup.js"></script>
</body>
</html>
